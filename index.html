/* Layout: the wallet as a native-style app screen. Phone: full screen. Desktop: inside a flat phone frame. Pure black, Sectora blue. */
:root{--lime:#bcff2f;--bg:#000;--s1:#0c0e12;--s2:#15181e;--s3:#1d2128;--ln:rgba(255,255,255,.085);--tx:#e9edf4;--mu:#8b93a6;--fa:#545c6e;--b:#1569ff;--b2:#5c9bff;--ok:#36d98a;--warn:#f0b54a;--bad:#ff6b5c;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
/* portada estilo exchange de primer nivel: barra superior, globo vivo, carrusel con indicador y botones blanco/oscuro */
.okx .sc{display:flex;flex-direction:column}
.okx .car{flex:none}
.otop{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.otop .brand{display:flex;align-items:center;gap:11px;min-width:0}
.bn{font:500 19px/1 var(--sans);letter-spacing:-.02em;color:var(--tx);white-space:nowrap}
.bn i{font-style:normal;font-weight:300;color:var(--mu);letter-spacing:-.01em}
.bchip{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--b2);background:rgba(21,105,255,.16);border-radius:6px;padding:5px 7px;flex:none}
html[data-theme="light"] .bchip{background:rgba(21,105,255,.08);color:#1569ff}
.tbr{display:none}
@media (max-width:520px){.otop .brand{gap:9px}.otop .brand svg{width:32px;height:32px}.otop .bn{font-size:17px}.otop .bchip{font-size:9.5px;padding:4px 6px}}
@media (max-width:380px){.otop .bchip{display:none}}
@media (max-width:380px){.acts4 button{font-size:12px;padding:13px 10px 11px;letter-spacing:-.01em}}
.otop .lang{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);font-size:13px;font-weight:500}
.okx .globe{width:min(100%,318px);margin:12px auto 0}
.car{overflow:hidden;margin-top:22px;touch-action:pan-y;cursor:grab}
.track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.cs{flex:0 0 100%;min-width:0;padding-right:10px}
.cs .tg2{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--b2);text-transform:uppercase}
.cs .tg2::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cs .tg2.g{color:var(--lime)}
.cs h1{margin:12px 0 0;font-size:38px;line-height:1.07;font-weight:500;letter-spacing:-.04em}
.cs h1 em{font-style:normal;color:var(--b)}
.cs p{margin:12px 0 0;color:var(--mu);font-size:15px;line-height:1.55;max-width:330px}
.pager{display:flex;gap:6px;margin-top:22px}
.pager button{width:8px;height:4px;border-radius:2px;background:#2a2e36;transition:width .3s,background .3s}
.pager button.on{width:26px;background:#fff}
.btn.white{background:#fff;color:#000}
.btn.dark{background:#16191f;color:#fff}
.legal{font-size:12px;color:var(--fa);text-align:center;padding-top:2px}
.legal b{color:var(--lime);font-weight:500}
/* intro breve al abrir: el logo aparece, dibuja su anillo, sale el nombre y el logo vuela al centro del globo */
.intro{position:absolute;inset:0;z-index:60;background:#000;cursor:pointer}
.intro .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center}
.intro .il{width:104px;height:104px;border-radius:9%}
.intro .il svg{width:100%;height:100%;display:block;overflow:visible}

.scard .net{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.18);font-size:12px;font-weight:500}
.scard .net i{width:6px;height:6px;border-radius:50%;background:#7dffb9}
.scard .lb{position:relative;margin-top:30px;font-size:13px;color:rgba(255,255,255,.75)}
.scard .v{position:relative;margin-top:6px;font-size:30px;font-weight:400;letter-spacing:-.035em;line-height:1.05}
.scard .r3{position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:center;justify-content:space-between;font:500 13px/1 var(--mono);color:rgba(255,255,255,.88);letter-spacing:.04em}
.scard .r3 button{display:flex;align-items:center;gap:8px;color:inherit}
.rcard{position:relative;margin-top:12px}
.cbadge{position:absolute;right:-8px;top:-12px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 6px #000;z-index:2}
.feat{margin-top:24px}
.feat div{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--ln);font-size:14px;color:rgba(255,255,255,.86)}
.feat div:last-child{border-bottom:1px solid var(--ln)}
/* inicio */
.top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.acc{display:flex;align-items:center;gap:11px;min-width:0}
.acc b{display:flex;align-items:center;gap:5px;font-weight:500;font-size:16px}
.acc small{display:block;font:400 11.5px/1.2 var(--mono);color:var(--mu);margin-top:2px}
.ibs{display:flex;gap:10px}
.disp{margin-top:12px;padding:16px 18px 14px}
.disp .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bigbal{margin-top:14px;display:flex;align-items:baseline;gap:9px}
.bigbal b{font-size:54px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigbal b.na{color:var(--fa);font-weight:300}
.bigbal em{font-style:normal;font-size:18px;font-weight:500;color:var(--mu)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--mu)}
.meta b{color:var(--warn);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.dc{margin-top:16px;padding-top:16px;border-top:1px solid var(--ln);position:relative}
.dc svg{display:block;width:100%;height:auto}
.dc .em{position:absolute;left:0;right:0;top:46px;text-align:center;font-size:12.5px;color:var(--mu)}
.tf2{display:flex;justify-content:space-between;margin-top:12px}
.tf2 button{font:500 11px/1 var(--mono);color:var(--fa);padding:7px 11px;border-radius:99px;letter-spacing:.06em}
.tf2 button.on{color:#000;background:#fff}
.acts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.acts4 button{height:80px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px 13px 12px;font-size:13px;font-weight:500;background:var(--s1);border:1px solid var(--ln)}
.acts4 button.pri{background:var(--b);border-color:var(--b)}
.lh{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 2px 4px;font-weight:500;font-size:15px}
.lh span{font-weight:500;font-size:13px;color:var(--b2)}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);overflow:hidden;flex:none}
.li b{font-weight:500;font-size:15.5px;display:block}
.li small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right}
.li .r b{font-variant-numeric:tabular-nums}
.tabs{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:246px;margin-left:-123px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;z-index:8;background:var(--s1);border:1px solid var(--ln)}
.tabs button{height:48px;min-width:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--fa);font-size:14px;font-weight:500;padding:0 12px}
.tabs button.on{color:#000;background:#fff;padding:0 18px}
/* recibir */
.qcard{margin-top:14px;border-radius:30px;background:#1569ff;padding:18px 18px 20px;color:#fff}
.qcard .r1{display:flex;align-items:center;justify-content:space-between}
.qcard .wm{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;letter-spacing:.26em}
.qcard .net{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.18);font-size:12px;font-weight:500}
.qcard .net i{width:6px;height:6px;border-radius:50%;background:#7dffb9}
.qp{margin:18px auto 0;width:min(100%,252px);padding:16px;border-radius:24px;background:#fff}
.qp svg{display:block;width:100%;height:auto}
.qcard .ad{margin-top:16px;text-align:center;font:500 14px/1.6 var(--mono);letter-spacing:.02em;overflow-wrap:anywhere}
.qcard .ad span{color:rgba(255,255,255,.55)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
/* enviar */
.to{margin-top:10px;min-height:68px;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px}
.to .tx{flex:1;min-width:0}
.to small{display:block;color:var(--mu);font-size:12px}
.to input{width:100%;background:none;border:0;outline:none;font:500 15px/1.3 var(--mono);margin-top:2px;padding:0}
.to .ok{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:12.5px;font-weight:500;flex:none}
.to .no{color:var(--bad)}
.amt{margin-top:26px;text-align:center}
.amt .v{font-size:84px;font-weight:300;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.amt .v.empty{color:var(--s3)}
.tokp{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px 7px 7px;border-radius:99px;font-weight:500;font-size:14px;background:var(--s1);border:1px solid var(--ln)}
.amt .av2{margin-top:12px;font-size:13px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);row-gap:2px;margin-top:12px}
.kp button{height:56px;display:grid;place-items:center;font-size:27px;font-weight:400;border-radius:16px}
.kp button:active{background:var(--s1)}
/* revisar */
.rvh{margin-top:22px;display:grid;justify-items:center;text-align:center}
.rvh small{font-size:13px;color:var(--mu)}
.rvh .big{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.rvh .big b{font-size:62px;font-weight:300;letter-spacing:-.045em;line-height:1}
.rvh .big span{font-size:20px;color:var(--mu);font-weight:500}
.flow{margin-top:26px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center}
.flow .p{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.flow .p b{font-size:13.5px;font-weight:500}.flow .p small{font:400 11.5px/1 var(--mono);color:var(--mu)}
.flow .ar{display:grid;place-items:center;margin-top:-30px}
.kv{margin-top:12px;padding:2px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--ln);font-size:14px;color:var(--mu)}
.kv div:first-child{border-top:0}
.kv b{font-weight:500;color:var(--tx);text-align:right}
.kv .m{font:500 13.5px/1.4 var(--mono)}
.slide{position:relative;height:66px;border-radius:33px;background:var(--s1);border:1px solid var(--ln);touch-action:none;user-select:none;-webkit-user-select:none}
.slide .kn{position:absolute;left:5px;top:5px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--b);cursor:grab}
.slide .tx{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;font-size:15.5px;padding-left:40px;color:rgba(255,255,255,.9);pointer-events:none}
.slide .ch{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.slide.done .kn{background:var(--ok)}
/* firmado */
.sg{position:relative;width:min(100%,290px);aspect-ratio:1;margin:6px auto 0}
.sg canvas{position:absolute;inset:0;width:100%;height:100%}
.sg .bdg{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;background:var(--b);box-shadow:0 0 0 8px #000}
/* ajustes */
.prof{margin-top:16px;padding:16px;display:flex;align-items:center;gap:14px}
.mini{position:relative;width:76px;height:48px;border-radius:10px;background:#1569ff;overflow:hidden;flex:none}
.mini img{position:absolute;right:-30px;top:-22px;width:100px;height:100px}
.mini .lg{position:absolute;left:8px;top:8px}
.prof b{display:block;font-weight:500;font-size:17px}
.prof small{display:block;font:400 12px/1.3 var(--mono);color:var(--mu);margin-top:3px}
.prof .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.prof .chip{padding:5px 9px;font-size:11.5px;background:var(--s2)}
.gl2{margin:22px 0 9px 4px}
.grp{padding:0 14px}
.grp .row:first-child{border-top:0}
.pill3{display:flex;gap:4px}
.pill3 button{padding:7px 10px;border-radius:99px;font:500 12px/1 var(--mono);color:var(--mu);border:1px solid var(--ln)}
.pill3 button.on{background:#fff;color:#000;border-color:#fff}
.toast{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;background:#fff;color:#000;font-weight:500;font-size:14px;z-index:50;white-space:nowrap}
.fade{animation:fin .28s ease both}
@keyframes fin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
/* ---------- activos tokenizados (en desarrollo) ---------- */
.tabs{width:300px;margin-left:-150px}
.dev{margin-top:16px;padding:14px 16px;border-radius:18px;display:flex;gap:12px;align-items:flex-start;background:rgba(240,181,74,.07);border:1px solid rgba(240,181,74,.28)}
.dev svg{flex:none;margin-top:1px}
.dev b{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--warn)}
.dev span{display:block;margin-top:7px;font-size:13px;line-height:1.5;color:var(--tx)}
.tsum{margin-top:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tsum div small{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa)}

.tsum .nw{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu)}
.tsum .nw em{font-style:normal;display:inline-flex;align-items:center;gap:7px;color:var(--tx);font-weight:500}
.tsum .nw em i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.aempty{margin-top:8px;padding:22px 18px;text-align:center;color:var(--mu);font-size:13.5px;line-height:1.5}
.aempty svg{display:block;margin:0 auto 10px}
.acard{margin-top:10px;padding:16px;position:relative}
.acard .ah{display:flex;align-items:center;gap:12px}
.acard .ai{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln);color:var(--b2);flex:none}
.acard .ai svg{width:22px;height:22px}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-weight:500;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .at small{display:block;margin-top:2px;color:var(--mu);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagx{flex:none;padding:5px 9px;border-radius:99px;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ln);color:var(--mu)}
.tagx.dr{color:var(--warn);border-color:rgba(240,181,74,.35)}
.tagx.ex{color:var(--b2);border-color:rgba(92,155,255,.35)}
.acard .ag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.acard .ag div{padding:10px;border-radius:12px;background:var(--s2)}
.acard .ag small{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fa)}
.acard .ag b{display:block;margin-top:6px;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .ah .ibtn{flex:none}
.stl{display:flex;align-items:center;gap:10px;margin-top:24px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fa)}
.stl i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--b2);letter-spacing:0}
.acls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.acls button{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-size:13px;font-weight:500;text-align:left;line-height:1.25}
.acls button svg{width:20px;height:20px;flex:none}
.acls button.on{border:1.5px solid var(--b);color:var(--tx);background:rgba(21,105,255,.1)}
.acls button.on svg{color:var(--b2)}
.tf .fld{margin-top:14px}
.tf .in{min-height:54px}
.tf .in .u{font:500 12px/1 var(--mono);letter-spacing:.1em;color:var(--fa);padding-right:10px}
.tf{min-width:0}
.tf .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tf .fld{min-width:0}
.drop{margin-top:12px;padding:18px 16px;border-radius:18px;border:1.5px dashed var(--s3);display:flex;gap:12px;align-items:center;color:var(--mu);font-size:13px;line-height:1.45}
.drop svg{flex:none}
.drop b{display:block;color:var(--tx);font-weight:500;font-size:14px}
.tkp{margin-top:24px;padding:18px;border-radius:22px;background:linear-gradient(160deg,#10141c,#07090c);border:1px solid var(--ln)}
.tkp .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tkp .sym{font:500 22px/1 var(--mono);letter-spacing:.04em;color:var(--tx)}
.tkp .nm{margin-top:8px;color:var(--mu);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkp .kv{margin-top:14px;padding:0;background:none;border:0}
.tkp .kv div{padding:11px 0;font-size:13px}
.ckl{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.ckl span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);font-size:12px;color:var(--fa)}
.ckl span.ok{color:var(--tx)}
.ckl span svg{opacity:.35}
.ckl span.ok svg{opacity:1}
.hr2{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;width:100%;text-align:left}
.hr2 .shd{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln);color:var(--b2);flex:none}
.hr2 .t{flex:1;min-width:0}
.hr2 b{display:block;font-weight:500;font-size:15px}
.hr2 small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.ibtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln);color:var(--mu)}


/* logos oficiales y verificado */
.tkl{display:block;flex:none;border-radius:50%;object-fit:cover;background:#15181e}
.vbadge{display:inline-flex;vertical-align:-2px;margin-left:6px}
.vbadge svg{display:block}

/* anadir token */
.lh .addt{display:inline-flex;align-items:center;gap:6px;color:var(--b2);font-size:13px;font-weight:500}
.unv{font-style:normal;color:var(--warn)}
.ctdel{flex:none;margin-left:auto;padding:8px 12px;border-radius:12px;border:1px solid var(--ln);color:var(--mu);font-size:13px}
.ctdel:hover{color:var(--bad);border-color:rgba(255,107,92,.4)}
.ctres{padding:16px}
.ctres .note a{color:var(--b2);text-decoration:underline}

/* avatar: logo de la wallet para todos */
.avi.lgav{background:none;border-radius:0;overflow:visible}
.avi.lgav svg{width:100%;height:100%}

/* foto de perfil */
.avi.avx{overflow:hidden;background:var(--s2);padding:0}
.avi.avx img,.avi.avx svg{width:100%;height:100%;display:block;object-fit:cover}
.avi{cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 16px}
.avopt{aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s ease}

.avopt svg,.avopt img{width:100%;height:100%;display:block;object-fit:cover}
.avopt.on{outline-color:var(--b)}
.avup{width:100%;justify-content:center;display:flex;align-items:center;gap:8px;cursor:pointer}
.avnote{display:flex;align-items:center;gap:7px;justify-content:center;margin:12px 0 0;font-size:12px;color:var(--mu)}
/* datos de la empresa en la portada */
.co{display:grid;gap:2px;justify-items:center;text-align:center;margin-top:4px;font-size:11px;line-height:1.5;color:var(--fa);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.co b{font-weight:500;color:var(--mu)}
.co p{margin:0}
.co .cty::before{content:" · "}
/* que el iPhone no convierta numeros y direcciones en enlaces subrayados */
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important}
/* portada con el pulso de red: el fondo ocupa toda la pantalla y los textos dejan sitio a la animacion */
.screen:has(.cbg){isolation:isolate}
.cbg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:-1;pointer-events:none}
.okx .globe.code,.wel .globe.code{width:min(100%,360px)}
.okx .car{margin-top:12px}
.okx .cs h1{font-size:30px;margin-top:9px}
.okx .cs p{font-size:13.5px;line-height:1.5;margin-top:7px}
.okx .pager{margin-top:14px}
.okx .ft,.screen:has(.cbg) .ft{gap:8px;padding-top:8px}
.screen:has(.cbg) .sc{padding-bottom:4px}
.wel .globe.code ~ form .err{min-height:0;margin-top:6px}
.wel .globe.code ~ form .pwin{margin-top:18px}
.okx .ft .btn,.screen:has(.cbg) .ft .btn{height:50px;font-size:15.5px}
.wel .globe.code ~ .kick{margin-top:12px}
.wel .globe.code ~ .h1{font-size:32px;margin-top:10px}
.wel .addr .anm{font-family:var(--sans);font-weight:500;color:var(--tx)}
/* SectoraEVM en las redes: recuadro de proximo lanzamiento con el estilo del Roadmap de sectoraorg.com */
.evmsoon{position:relative;margin-top:14px;padding:16px 16px 16px 32px;border:1px solid rgba(21,105,255,.3);border-radius:16px;background:radial-gradient(120% 140% at 100% 0%,rgba(21,105,255,.2),transparent 60%),var(--s1);overflow:hidden}
.evmsoon::before{content:"";position:absolute;left:16px;top:22px;bottom:20px;width:1px;background:linear-gradient(180deg,#1569ff,rgba(21,105,255,.08))}
.evmsoon::after{content:"";position:absolute;left:13px;top:16px;width:7px;height:7px;border-radius:50%;background:#1569ff;box-shadow:0 0 11px 1px rgba(21,105,255,.75)}
.es-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.es-q{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--b2)}

const cu16 = n => { const o = []; for (;;) { let b = n & 0x7f; n >>= 7; if (!n) { o.push(b); return o; } o.push(b | 0x80); } };

    try { nonce = Number(BigInt(await rpc(n, 'eth_getTransactionCount', [S.addr, 'pending']))); const gp = BigInt(await rpc(n, 'eth_gasPrice', [])); fee = { maxFeePerGas: gp * 2n, maxPriorityFeePerGas: gp / 10n || 1n }; } catch (e) {}
    return { type: 2, chainId: n.chainId, nonce, ...fee }; }
  const [cid, nc, gp, blk] = await Promise.all([rpc(n, 'eth_chainId', []), rpc(n, 'eth_getTransactionCount', [S.addr, 'pending']), rpc(n, 'eth_gasPrice', []), rpc(n, 'eth_getBlockByNumber', ['latest', false])]);
  if (BigInt(cid) !== BigInt(n.chainId)) throw new UErr('Network check failed. Try again later.');

  if (base === 0n && tip < price) tip = price;                                   // BNB Chain: sin base fee, la propina es el precio del gas
  if (n.chainId === 1 && tip < 50000000n) tip = 50000000n;                       // Ethereum: propina minima 0.05 gwei
  let max = base * 2n + tip; if (max < price) max = price;
  if (base === 0n) { if (speed === 'fast') { tip = tip * 3n / 2n; max = tip; } }                                  // BNB Chain: precio unico; rapido = +50%
  else if (speed === 'slow') { tip = tip * 8n / 10n; if (n.chainId === 1 && tip < 50000000n) tip = 50000000n; max = base * 5n / 4n + tip; }
  else if (speed === 'fast') { tip = tip * 2n + (n.chainId === 1 ? 500000000n : 0n); max = base * 3n + tip; }
